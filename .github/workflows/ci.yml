# 持续集成：push/PR 时触发，保证代码质量
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  check:
    name: 检查与测试 (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: 下载依赖
        run: go mod download

      - name: 代码格式检查
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "❌ 以下文件未格式化："
            gofmt -l .
            exit 1
          fi

      - name: 静态检查
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go vet ./...

      - name: 单元测试
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: go test -v ./internal/...

      - name: 交叉编译验证
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -o /tmp/k8s-patrol-test ./cmd/k8s-patrol/
