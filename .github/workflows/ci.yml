# CI: 持续集成（push/PR 时触发）
# 作用：保证代码格式、静态检查、单测、多平台编译都通过，防止破坏性提交合入
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:  # 支持手动触发，便于调试

jobs:
  check:
    name: 检查与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: 下载依赖
        run: go mod download

      - name: 代码格式检查（gofmt）
        run: |
          # gofmt -l 列出格式不符合的文件，有输出则失败
          if [ -n "$(gofmt -l .)" ]; then
            echo "❌ 以下文件未格式化，请运行 gofmt -w .："
            gofmt -l .
            exit 1
          fi

      - name: 静态检查（go vet）
        run: go vet ./...

      - name: 单元测试
        run: go test -v ./internal/...

  build-matrix:
    name: 多平台编译验证
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: 交叉编译 ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -o /tmp/k8s-patrol-test ./cmd/k8s-patrol/

