# Release: 发布流水线（打 tag 时触发）
# 触发：git tag v1.0.0 && git push origin v1.0.0
# 作用：交叉编译 6 个平台二进制，打包后自动发布到 GitHub Releases
name: Release

on:
  push:
    tags:
      - 'v*'  # 匹配 v1.0.0、v2.1.3 等

permissions:
  contents: write  # 创建 Release 需要写权限

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史，用于 git describe 获取版本号

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: 解析版本信息
        id: meta
        run: |
          echo "version=$(git describe --tags --always)" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: 交叉编译所有平台
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_DATE: ${{ steps.meta.outputs.date }}
        run: make dist-zip

      - name: 上传构建产物（artifact）
        uses: actions/upload-artifact@v4
        with:
          name: k8s-patrol-release
          path: dist/*
          retention-days: 30

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.version }}
          generate_release_notes: true  # 自动从 commit 生成 changelog
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

