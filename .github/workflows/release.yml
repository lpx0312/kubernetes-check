# 发布流水线：打 tag(v*) 时触发，构建 6 平台并发布 Release
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号（如 v1.0.0）'
        required: true
        default: 'v0.0.0'

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: 解析版本信息
        id: meta
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "version=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(git describe --tags --always)" >> $GITHUB_OUTPUT
          fi
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: 安装 Make 依赖检查
        run: which make && make --version | head -1

      - name: 交叉编译并打包
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_DATE: ${{ steps.meta.outputs.date }}
        run: make dist-zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: k8s-patrol-release
          path: dist/*
          retention-days: 30

      - name: 提取 CHANGELOG
        id: changelog
        run: |
          # 从 CHANGELOG.md 提取当前版本（## [vX.Y.Z]）到下一个版本之间的内容
          # 用 index() 做字符串匹配，避免版本号里的 [] 被 awk 当成正则字符集
          VERSION="${{ steps.meta.outputs.version }}"
          echo "提取版本 $VERSION 的 changelog"
          NOTES=$(awk -v ver="## [$VERSION]" '
            index($0, ver) { found=1; next }
            /^## \[/ && found { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::warning::CHANGELOG.md 中未找到版本 $VERSION 的内容，Release body 将为空"
            NOTES="（CHANGELOG.md 中未找到本版本记录）"
          fi
          # 兼容多行输出，写入 GITHUB_OUTPUT（EOF 分隔符方式）
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> $GITHUB_OUTPUT

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
